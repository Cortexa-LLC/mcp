# Go CI — build, vet, and test every module in this repo on each PR and push to main.
#
# Layout note: src/kglib, src/kg, and src/markitdown are three SEPARATE Go modules
# (no go.work), so each gets its own matrix leg. That also makes the PR check list
# name the failing module directly instead of one opaque "ci" red X.
#
# CGo: kglib and kg depend on github.com/kuzudb/go-kuzu, which is a CGo binding.
# go-kuzu vendors a prebuilt lib/dynamic/linux-amd64/libkuzu.so with an embedded
# rpath, and kg additionally pulls in go-tree-sitter, so both build on a stock
# ubuntu-latest runner with only the default C toolchain. No apt packages needed.
# If a future bump drops the vendored .so, this is the job that will notice.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [kglib, kg, markitdown]
    defaults:
      run:
        working-directory: src/${{ matrix.module }}
    steps:
      # Actions pinned to commit SHAs so a retag upstream can't change what runs
      # here. Rotate by re-resolving the tag:
      #   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Read the toolchain floor from the module itself rather than pinning a
          # version here — the three modules declare different `go` directives
          # (1.26.2 for kglib/kg, 1.24.1 for markitdown) and this keeps CI honest
          # to whatever each one actually asks for.
          go-version-file: src/${{ matrix.module }}/go.mod
          cache-dependency-path: src/${{ matrix.module }}/go.sum

      # First, because it is the cheapest signal and the most annoying one to
      # discover after a long test run. `gofmt -l` prints offending files and
      # exits 0 either way, so the emptiness of its output is the assertion.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::run 'gofmt -w' on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
  # src/renameio-compat is a fourth module, kept out of the matrix above because
  # it has no dependencies and therefore no go.sum for setup-go's cache to
  # resolve. It stands in for github.com/google/renameio in kglib and kg on
  # every platform, not just Windows, so a break here breaks both of them.
  renameio-compat:
    name: renameio-compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/renameio-compat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: src/renameio-compat/go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::run 'gofmt -w' on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
  # Windows is where this repository's platform-specific code actually lives:
  # the renameio-compat shim, cypherPathLiteral, fileURLPath's drive-letter
  # handling, and the DLL that install.py deploys. Without a Windows runner
  # every `if runtime.GOOS == "windows"` branch is invisible to CI, and a
  # regression in it would pass green and surface only when somebody built
  # there by hand -- which is how this repository reached the state the Windows
  # support commit had to dig it out of.
  windows:
    name: ${{ matrix.module }} (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [kglib, kg, markitdown, renameio-compat]
    defaults:
      run:
        # Git Bash, so these steps are the same shell as the ubuntu legs above
        # rather than a second PowerShell dialect to maintain.
        shell: bash
        working-directory: src/${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: src/${{ matrix.module }}/go.mod

      # Doubles as the canary for .gitattributes. gofmt only accepts LF, so if
      # `eol=lf` ever stops applying and this runner checks files out with CRLF,
      # it fails here with a clear message instead of puzzling whoever next
      # clones the repository on Windows.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::CRLF checkout or unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # Kuzu links dynamically on Windows and cgo has no rpath to offer there,
      # so the loader searches the executable's own directory and PATH. `go
      # test` runs each test binary from a temporary build directory, which the
      # DLL is not in, and the module cache is not on PATH -- without this the
      # binary dies before any test runs with exit status 0xc0000135
      # (STATUS_DLL_NOT_FOUND). Resolved the same way install.py does it.
      - name: Put the Kuzu DLL on PATH
        if: matrix.module == 'kg' || matrix.module == 'kglib'
        run: |
          # Download first: `go list -m -f '{{.Dir}}'` prints an EMPTY string for
          # a module that is not in the local cache rather than failing, so on a
          # cold runner this silently resolved to "/lib/dynamic/windows". It only
          # worked when developed against an already-warm cache.
          go mod download github.com/kuzudb/go-kuzu
          dir="$(go list -m -f '{{.Dir}}' github.com/kuzudb/go-kuzu)"
          test -n "$dir" || { echo "::error::could not resolve the go-kuzu module directory"; exit 1; }
          kuzu="$dir/lib/dynamic/windows"
          test -f "$kuzu/kuzu_shared.dll" || { echo "::error::kuzu_shared.dll not found at $kuzu"; exit 1; }
          echo "$kuzu" >> "$GITHUB_PATH"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Deliberately without -race, unlike the ubuntu legs. ThreadSanitizer
      # cannot reserve its shadow memory under this toolchain ("failed to
      # allocate ... error code: 487", ERROR_INVALID_ADDRESS), which fails the
      # run for reasons that have nothing to do with the code under test. The
      # ubuntu matrix covers -race; this matrix covers the platform.
      - name: Test
        run: go test ./...
